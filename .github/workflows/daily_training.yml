name: Daily training and registration

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      AQI_PROJECT_ROOT: ${{ github.workspace }}
      FEATURE_STORE_BACKEND: hybrid
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_FEATURE_GROUP_VERSION: "6"
      HOPSWORKS_SYNC_MODELS: "true"
      MODEL_N_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-hopsworks.txt
      - run: python -m pip install --no-deps .
      - run: python scripts/hydrate_hopsworks.py --features
      - run: python scripts/validate_data.py --city all --strict
      - run: python scripts/train.py --city all
      - run: python scripts/sync_hopsworks.py --model
