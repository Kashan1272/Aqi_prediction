name: Historical backfill

on:
  workflow_dispatch:
    inputs:
      cities:
        description: City key, comma-separated keys, or all
        required: true
        default: all
      days:
        description: Number of historical days
        required: true
        default: "730"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AQI_PROJECT_ROOT: ${{ github.workspace }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_FEATURE_GROUP_VERSION: "6"
      FEATURE_STORE_BACKEND: hybrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-hopsworks.txt
      - run: python -m pip install --no-deps .
      - run: python scripts/backfill.py --city "${{ inputs.cities }}" --days "${{ inputs.days }}"
      - run: python scripts/validate_data.py --city "${{ inputs.cities }}" --strict
      - run: python scripts/sync_hopsworks.py --features --city "${{ inputs.cities }}"
