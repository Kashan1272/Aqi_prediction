name: Hourly feature and forecast pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  forecast:
    runs-on: ubuntu-latest
    env:
      AQI_PROJECT_ROOT: ${{ github.workspace }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
      FEATURE_STORE_BACKEND: hybrid
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_FEATURE_GROUP_VERSION: "6"
      HOPSWORKS_SYNC_MODELS: "true"
      MODEL_N_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-hopsworks.txt
      - run: python -m pip install --no-deps .
      - run: python scripts/hydrate_hopsworks.py --features --model
      - run: python scripts/forecast.py --city all
      - run: python scripts/sync_hopsworks.py --features --city all
